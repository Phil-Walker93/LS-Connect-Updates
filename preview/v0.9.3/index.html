<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101d">
  <title>LS Connect RC Preview v0.9.3</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07101d;color:#dbeafe;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #preview-boot{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.card{width:min(640px,92vw);padding:28px;border:1px solid rgba(125,211,252,.16);border-radius:22px;background:rgba(15,23,42,.72);box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .spinner{width:38px;height:38px;margin:0 auto 16px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:s 1s linear infinite}h1{margin:0 0 8px;font-size:20px}p{margin:7px 0;color:#94a3b8;line-height:1.55}.status{margin-top:14px;color:#7dd3fc;font-size:13px}pre{margin-top:18px;padding:13px;text-align:left;white-space:pre-wrap;border:1px solid #475569;border-radius:12px;background:#0f172a;color:#fecaca}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="preview-boot"><div class="card"><div class="spinner"></div><h1>LS Connect Redesign Preview</h1><p>Isolierter RC-Startweg. Production bleibt unverändert.</p><div id="preview-status" class="status">Lokaler Preview-Proxy wird geprüft…</div></div></div>
<script>
(async()=>{
  const STABLE='https://ls-connect-online.vercel.app/';
  const EXPECTED_STABLE="const RELEASE_VERSION='0.7.10.13';";
  const PATCH_ANCHOR="['0.7.10.13','v071013.js']";
  const RC_PATCH="['0.9.1','v091.js']";
  const PREVIEW_PATCH="['0.9.3','v093-preview-marker.js']";
  const status=document.getElementById('preview-status');
  const fail=error=>{
    console.error('[LS Connect RC Preview] startup failed',error);
    document.querySelector('.card').innerHTML='<h1>Preview konnte nicht gestartet werden</h1><p>Die Sicherheitsprüfung hat den Start abgebrochen. Production wurde nicht verändert.</p><pre>'+String(error?.stack||error?.message||error).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>';
  };
  try{
    status.textContent='Prüfe lokalen /api/script-Proxy…';
    const probe=await fetch('/api/script?version=0.9.1&file=v091.js&preview_probe=0.9.3',{cache:'no-store'});
    const probeType=String(probe.headers.get('content-type')||'').toLowerCase();
    const probeText=await probe.text();
    if(!probe.ok||!probeType.includes('javascript')||!probeText.includes('LS Connect v0.9.1')){
      throw new Error('Der lokale Preview-Proxy liefert /api/script nicht korrekt aus. Der RC wird nicht gestartet.');
    }

    status.textContent='Lade unveränderte Production-Basis…';
    const response=await fetch(STABLE,{cache:'no-store',mode:'cors'});
    if(!response.ok)throw new Error(`Production-Loader: HTTP ${response.status}`);
    let html=await response.text();
    if(!html.includes(EXPECTED_STABLE))throw new Error('Production entspricht nicht der erwarteten Stable-Basis 0.7.10.13.');
    if(!html.includes(PATCH_ANCHOR))throw new Error('Stable-Patchanker v0.7.10.13 wurde nicht gefunden.');
    if(html.includes(RC_PATCH)||html.includes(PREVIEW_PATCH))throw new Error('Production enthält bereits Preview-/RC-Patches; Abgrenzung ist nicht eindeutig.');

    status.textContent='Erzeuge isolierte RC-Patchkette…';
    html=html.replace('<head>','<head><base href="https://ls-connect-online.vercel.app/">');
    html=html.replace(PATCH_ANCHOR,`${PATCH_ANCHOR},\n    ${RC_PATCH},\n    ${PREVIEW_PATCH}`);
    html=html.replace('<title>LS Connect Online</title>','<title>LS Connect RC Preview v0.9.3</title>');
    html=html.replace("const RELEASE_VERSION='0.7.10.13';","const RELEASE_VERSION='0.7.10.13';\n  window.__LS_CONNECT_PREVIEW_CHANNEL__='redesign-rc';\n  window.__LS_CONNECT_PREVIEW_LOADER_VERSION__='0.9.3';");

    status.textContent='Starte LS Connect v0.9.1 RC vollständig…';
    document.open();document.write(html);document.close();
  }catch(error){fail(error);}
})();
</script>
</body>
</html>

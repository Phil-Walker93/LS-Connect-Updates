name: Snapshot LS Connect 2 production

on:
  push:
    branches: [tooling/lsc2-prod-snapshot-20260925]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/lsc2-prod-snapshot-20260925
      - name: Fetch production assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lsc2-prod-snapshot
          mkdir -p .lsc2-prod-snapshot/assets
          curl -fsSL https://ls-connect-2.vercel.app/ -o .lsc2-prod-snapshot/index.html
          grep -oE '/assets/[^" ]+\.(js|css)' .lsc2-prod-snapshot/index.html | sort -u > /tmp/assets.txt
          while IFS= read -r asset; do
            curl -fsSL "https://ls-connect-2.vercel.app$asset" -o ".lsc2-prod-snapshot$asset"
          done < /tmp/assets.txt
          printf '%s\n' "snapshot=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .lsc2-prod-snapshot/SNAPSHOT.txt
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lsc2-prod-snapshot
          git commit -m "chore(lsc2): snapshot current production assets"
          git push origin HEAD:tooling/lsc2-prod-snapshot-20260925

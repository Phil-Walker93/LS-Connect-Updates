name: Build PhilTech Alpha 5.2
on:
  push:
    branches: [philtech-alpha5-2-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: philtech-build/project
    steps:
      - uses: actions/checkout@v4
      - name: Apply Alpha 4 base patch
        run: base64 -d ../alpha4_patch.b64 | tar -xzf -
      - name: Rebuild Alpha 5 patch
        shell: bash
        run: |
          cat ../a5part*.txt > ../alpha5_patch.rebuilt.b64
          echo "175268e0299ffa3fc184daeab115fdcb790f41232627d4916fbeeb9d3b6febf3  ../alpha5_patch.rebuilt.b64" | sha256sum -c -
          base64 -d ../alpha5_patch.rebuilt.b64 > ../alpha5_patch.tar.gz
          echo "d6ec4ca97bff511f409d2c542921ae3054d62cfb11a6885fe1fe6ee873921781  ../alpha5_patch.tar.gz" | sha256sum -c -
          tar -xzf ../alpha5_patch.tar.gz
      - name: Apply Alpha 5.1 visual fidelity patch
        shell: bash
        run: |
          cat ../a51part*.txt > ../alpha5_1_patch.rebuilt.b64
          echo "92e5e20208944e7c227911c7049a0f3f13f040835a74033b7927630fe16c460e  ../alpha5_1_patch.rebuilt.b64" | sha256sum -c -
          base64 -d ../alpha5_1_patch.rebuilt.b64 > ../alpha5_1_patch.tar.gz
          echo "aa708c4dc4c95cc05f8a71e6d00fe7541abe22f412059b1418c08f8216b83e30  ../alpha5_1_patch.tar.gz" | sha256sum -c -
          tar -xzf ../alpha5_1_patch.tar.gz
      - name: Apply Alpha 5.2 32x32 and UI patch
        shell: bash
        run: |
          cat ../a52part*.txt > ../alpha5_2_patch.rebuilt.b64
          echo "a877b393567b3bd8e9e670323c0d0d413cd46212b4de82a1b5f9892637cb1c44  ../alpha5_2_patch.rebuilt.b64" | sha256sum -c -
          base64 -d ../alpha5_2_patch.rebuilt.b64 > ../alpha5_2_patch.tar.gz
          echo "75c30a0e1f60d1988f5090feb0a875c0c139c82dc2c3712713fadf858ac1efc1  ../alpha5_2_patch.tar.gz" | sha256sum -c -
          tar -xzf ../alpha5_2_patch.tar.gz
      - name: Apply Alpha 5.2 screen constructor fix
        shell: bash
        run: |
          cat ../a52screenfix*.txt > ../a52screenfix.rebuilt.b64
          echo "4a7f846954f22898f4614c0c34f83e50afceb0c7107f90d47e8e0ec4d25e15f9  ../a52screenfix.rebuilt.b64" | sha256sum -c -
          base64 -d ../a52screenfix.rebuilt.b64 > ../a52screenfix.tar.gz
          echo "6329319480e1364aa7fc501bcb63c3d94ed2f5e69dcfc5c0e5f4c174915e7468  ../a52screenfix.tar.gz" | sha256sum -c -
          tar -xzf ../a52screenfix.tar.gz
      - name: Validate models and 32x32 assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("src/main/resources/assets/philtech")
          bad=[]
          missing=[]
          used=set()
          for p in (root/"models/block").glob("*.json"):
              d=json.loads(p.read_text())
              for i,e in enumerate(d.get("elements",[])):
                  f=e.get("from"); t=e.get("to")
                  if f and t and any(a>b for a,b in zip(f,t)):
                      bad.append((p.name,i,f,t))
              for v in d.get("textures",{}).values():
                  if isinstance(v,str) and v.startswith("philtech:block/"):
                      name=v.split("/")[-1]
                      used.add(name)
                      q=root/"textures/block"/(name+".png")
                      if not q.exists(): missing.append((p.name,str(q)))
          import struct
          def png_size(p):
              b=p.read_bytes()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              return struct.unpack(">II", b[16:24])
          wrong=[]
          for name in sorted(used):
              p=root/"textures/block"/(name+".png")
              if png_size(p) != (32,32): wrong.append((name,png_size(p)))
          for p in (root/"textures/item").glob("*.png"):
              if png_size(p) != (32,32): wrong.append((p.name,png_size(p)))
          if bad or missing or wrong:
              raise SystemExit(f"bad={bad} missing={missing} wrong_sizes={wrong}")
          print("Model + 32x32 validation OK")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: philtech-0.1.0-alpha.5.2
          path: philtech-build/project/build/libs/philtech-0.1.0-alpha.5.2.jar
          if-no-files-found: error

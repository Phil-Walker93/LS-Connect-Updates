name: Build PhilTech Alpha 3
on:
  push:
    branches: [philtech-alpha3-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: philtech-build/project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: philtech-0.1.0-alpha.3
          path: philtech-build/project/build/libs/philtech-0.1.0-alpha.3.jar
          if-no-files-found: error
